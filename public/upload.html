<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upload video — Scroll Scrubber</title>
<style>
  :root{ --bg:#071019; --foam:#EAF6F3; --muted:#93ADB8; --teal:#2FBFA6; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--foam);
    font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center;
  }
  .card{
    width: 100%; max-width: 420px; padding: 32px; border: 1px solid rgba(234,246,243,0.15);
    border-radius: 16px; background: rgba(255,255,255,0.02);
  }
  h1{ font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  p{ color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  label{ display:block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type=file]{
    width: 100%; padding: 12px; border-radius: 10px; border: 1px dashed rgba(234,246,243,0.3);
    background: rgba(255,255,255,0.03); color: var(--foam); margin-bottom: 18px; font-size: 13px;
  }
  .row{ display:flex; gap: 12px; margin-bottom: 18px; }
  .row > div{ flex:1; }
  input[type=number]{
    width:100%; padding:10px; border-radius:8px; border:1px solid rgba(234,246,243,0.2);
    background: rgba(255,255,255,0.03); color: var(--foam);
  }
  button{
    width: 100%; padding: 14px; border-radius: 999px; border: none; background: var(--teal);
    color: #04211c; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:disabled{ opacity: 0.5; cursor: not-allowed; }
  #status{ margin-top: 16px; font-size: 13px; color: var(--muted); min-height: 20px; }
  a{ color: var(--teal); }
</style>
</head>
<body>
  <div class="card">
    <h1>Upload your video</h1>
    <p>The server will extract it into a frame sequence with ffmpeg.</p>

    <form id="form">
      <label for="video">Video file (mp4, mov, webm, mkv)</label>
      <input type="file" id="video" name="video" accept="video/*" required />

      <div class="row">
        <div>
          <label for="fps">Sample rate (fps)</label>
          <input type="number" id="fps" name="fps" value="30" min="1" max="60" />
        </div>
        <div>
          <label for="width">Output width (px)</label>
          <input type="number" id="width" name="width" value="1280" min="320" max="3840" />
        </div>
      </div>

      <button type="submit" id="submitBtn">Upload &amp; extract frames</button>
      <div id="status"></div>
    </form>
  </div>

<script>
const form = document.getElementById('form');
const statusEl = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById('video');
  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append('video', fileInput.files[0]);
  formData.append('fps', document.getElementById('fps').value);
  formData.append('width', document.getElementById('width').value);

  submitBtn.disabled = true;
  statusEl.textContent = 'Uploading and extracting frames… this can take a few seconds.';

  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Upload failed.');
    }

    statusEl.innerHTML = `Done — extracted ${data.count} frames. <a href="/">View the scrub demo →</a>`;
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
